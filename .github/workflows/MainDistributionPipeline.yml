#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  # THE PIN EQUALS THE REGISTRY DEFAULT, AND THE WORKFLOW SHIPS EVERY LINE THE
  # REGISTRY BUILDS. Fleet rule (Teague, 2026-09-13): the duckdb submodule is
  # pinned at exactly the commit of the tag the stable build ships against, which
  # is also the version the community registry builds every extension with, and
  # this workflow also ships the next line the registry builds (build_next.yml).
  # Otherwise local builds and each repo's own CI artifacts carry a different
  # DuckDB than the served one, and extensions built in different repos cannot
  # co-load locally (the ABI is exact-version). Measured 2026-09-13: five sibling
  # repos were on a July dev commit, one on a v1.5.6-dev commit, one on DuckDB
  # main. Nothing but a check keeps this true. The second assertion keeps this
  # job's constants from drifting away from the `duckdb_version:` the build jobs
  # above actually use.
  duckdb-pin:
    name: DuckDB submodule pin equals the shipped tag
    runs-on: ubuntu-latest
    env:
      DUCKDB_VERSION: v1.5.5
      DUCKDB_NEXT: v2.0-cyanoptera
    steps:
      - uses: actions/checkout@v4
      - name: Compare the submodule pin with the tag's commit
        run: |
          set -eu
          want=$(git ls-remote --tags https://github.com/duckdb/duckdb "refs/tags/${DUCKDB_VERSION}^{}" | cut -f1)
          [ -n "$want" ] || want=$(git ls-remote --tags https://github.com/duckdb/duckdb "refs/tags/${DUCKDB_VERSION}" | cut -f1)
          have=$(git ls-tree HEAD duckdb | awk '{print $3}')
          echo "shipped tag ${DUCKDB_VERSION} -> ${want}"
          echo "submodule pin          -> ${have}"
          [ -n "$want" ] || { echo "::error::could not resolve tag ${DUCKDB_VERSION} upstream"; exit 1; }
          [ "$want" = "$have" ] || { echo "::error::duckdb submodule pin ${have} is not the ${DUCKDB_VERSION} tag ${want}; run: git -C duckdb fetch --tags && git -C duckdb checkout ${DUCKDB_VERSION}"; exit 1; }
          n=$(grep -c "duckdb_version: ${DUCKDB_VERSION}$" .github/workflows/MainDistributionPipeline.yml || true)
          [ "$n" -ge 1 ] || { echo "::error::no build job in this workflow ships duckdb_version: ${DUCKDB_VERSION}; this job's constant has drifted"; exit 1; }
          m=$(grep -c "duckdb_version: ${DUCKDB_NEXT}$" .github/workflows/MainDistributionPipeline.yml || true)
          [ "$m" -ge 1 ] || { echo "::error::no build job in this workflow builds the next line duckdb_version: ${DUCKDB_NEXT}"; exit 1; }
          # NO OTHER DuckDB PATCH VERSION may drift from the shipped ${DUCKDB_VERSION}
          # anywhere else in this file: sibling workflows (yaml, mcp) embed a version
          # in artifact NAMES and CLI download URLs (e.g. `yaml-v1.5.4-extension-wasm_*`,
          # `releases/download/v1.5.4/duckdb_cli`) that the `duckdb_version:` greps above
          # cannot see, so a bump left them stale and this job went green over a red
          # build. Comment lines (first non-space char `#`) are exempt. Branch/tag names
          # like `v2.0-cyanoptera` and `v1.5-variegata` have no third numeric component
          # and so never match this pattern.
          bad=0
          while IFS=: read -r lineno line; do
            printf '%s\n' "$line" | grep -qE '^[[:space:]]*#' && continue
            for v in $(printf '%s\n' "$line" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' || true); do
              if [ "$v" != "$DUCKDB_VERSION" ]; then
                echo "::error::line ${lineno}: ${line} — a DuckDB version literal that is not the shipped ${DUCKDB_VERSION}: derive it from the shipped version or bump it"
                bad=1
              fi
            done
          done < <(grep -nE 'v[0-9]+\.[0-9]+\.[0-9]+' .github/workflows/MainDistributionPipeline.yml || true)
          [ "$bad" -eq 0 ] || exit 1
          # THE AUTHORITY is the registry's own files, not this job's constants: a
          # constant checked only against itself passes for a year after the registry
          # moves (panduck, 2026-09-13). Resolve main to a sha first so the raw fetches
          # are not served from the branch cache. TWO degraded paths, deliberately
          # different: UNREACHABLE is the world being unavailable -> a NOTE, and the
          # summary says the registry assertions were not made; REACHABLE BUT
          # UNPARSEABLE is this check being wrong about the file -> a FAILURE.
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          base="https://raw.githubusercontent.com/duckdb/community-extensions"
          sha=$(curl -sf https://api.github.com/repos/duckdb/community-extensions/commits/main | grep -m1 -o '"sha": *"[0-9a-f]*"' | grep -o '[0-9a-f]\{40\}' || true)
          if body=$(curl -sf "${base}/${sha:-main}/.github/workflows/build.yml") && next_body=$(curl -sf "${base}/${sha:-main}/.github/workflows/build_next.yml"); then
            registry=$(printf '%s' "$body" | grep -m1 -o "inputs.duckdb_version || 'v[0-9][0-9.]*'" | grep -o "'v[0-9][0-9.]*'" | tr -d "'" || true)
            registry_next=$(printf '%s' "$next_body" | grep -m1 -o "duckdb_version: *'v[0-9][0-9.]*-[a-z]*'" | grep -o "'v[^']*'" | tr -d "'" || true)
            if [ -z "$registry" ] || [ -z "$registry_next" ]; then
              echo "::error::community-extensions at ${sha:-main} was fetched but build.yml/build_next.yml carry no recognisable duckdb_version (default='${registry}', next='${registry_next}'); this check's parse is wrong about the registry, fix the check"
              echo "duckdb-pin: FAILED, registry files fetched but unparseable" >> "$summary"; exit 1
            fi
            if [ "$registry" != "$DUCKDB_VERSION" ] || [ "$registry_next" != "$DUCKDB_NEXT" ]; then
              echo "::error::the community registry builds default=${registry} next=${registry_next} (at ${sha:-main}) but this repo ships default=${DUCKDB_VERSION} next=${DUCKDB_NEXT}; update the pin, the constants and the build jobs to the registry's lines"
              echo "duckdb-pin: FAILED, registry ${registry}/${registry_next} vs repo ${DUCKDB_VERSION}/${DUCKDB_NEXT}" >> "$summary"; exit 1
            fi
            mode="checked against the registry (default ${registry}, next ${registry_next}, at ${sha:-main})"
          else
            echo "::notice::could not reach the community registry; the pin was checked against the local constants only"
            mode="NOT checked against the registry (unreachable); local constants ${DUCKDB_VERSION}/${DUCKDB_NEXT} only"
          fi
          echo "duckdb-pin: OK, pin ${have:0:10} == ${DUCKDB_VERSION}; ${n} stable and ${m} next build job(s); ${mode}" | tee -a "$summary"

  # Next-line build: tracks duckdb v2.0-cyanoptera; expected to go red on
  # upstream API drift. Promoted 2026-09-13 (Teague's dual-line ruling): now
  # runs on pull_request too, not just push-to-main/dispatch (see below).
  duckdb-next-build:
    name: DuckDB main canary
    # This must be `if:` and NOT `continue-on-error:` — a job that calls a
    # REUSABLE workflow accepts only a fixed key set, and adding
    # continue-on-error makes the whole workflow fail to parse (scheduling zero
    # jobs, including the shippable build). Can also be run on demand:
    #   gh workflow run MainDistributionPipeline.yml --ref <branch>
    # Gated to run once, not twice, per PR: a push to a PR branch fires both a
    # push run and a pull_request run for the same commit, so an ungated job
    # would build it twice. Runs on PRs, on push to main, and on dispatch.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      duckdb_version: v2.0-cyanoptera
      ci_tools_version: main
      extension_name: yaml
      # windows_amd64 (MSVC) validated against duckdb main + shipped for v1.5.4; enabled
      # here for canary coverage too. windows_amd64_mingw stays excluded on this leg only
      # (validated on the v1.5.4 stable leg, not yet against duckdb main).
      exclude_archs: 'windows_amd64_mingw'

  # Shippable build. The submodules are pinned at the v1.5-variegata branch tip
  # (see .gitmodules), but the extension is BUILT against the v1.5.4 release tag
  # so the produced binary is a proper release (loadable by released DuckDB),
  # not a `-dev` build. This is the leg the community-extensions manylinux
  # (linux_amd64 / linux_arm64 docker) binaries are cut from.
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: yaml
      # Windows fully enabled: both windows_amd64 (MSVC) and windows_amd64_mingw build
      # and pass the full suite on this v1.5.4 leg (real ~24-min / ~31-min CI runs incl.
      # yaml_copy_to.test — the earlier "COPY TO deadlock" did not reproduce and is treated
      # as an intermittent flake; the historical /std:c++17 fmt C7525 compile error is stale
      # too). windows_amd64 ships in the community build (v1.7.0); mingw is validated here.
      exclude_archs: ''

  # Code-quality (clang-format) stays on the @main ci-tools target — the repo's
  # original, established config. Both targets install the same clang-format-11,
  # but they differ in scope: @main delegates to duckdb's git-diff-scoped
  # format-check (validates only uncommitted changes), whereas v1.5-variegata
  # runs `format.py --all`, which flags many PRE-EXISTING repo files (e.g.
  # duckdb_compat.hpp and maintainer-written code that predate this PR). Adopting
  # --all would require a repo-wide reformat that is out of scope for this DoS
  # fix; keeping @main preserves the status quo rather than weakening anything.
  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@main
    with:
      duckdb_version: v1.5.5
      ci_tools_version: main
      extension_name: yaml
      format_checks: 'format'

  # Guards against the LINKED_LIBS class of WASM bug (issue #40): the reusable
  # distribution workflow builds and uploads the .wasm but never inspects or
  # loads it, so a side module with unresolved yaml-cpp symbols ships green.
  # Two layers (see test/wasm/):
  #   1. static symbol check (hard gate) — no duckdb-wasm runtime needed.
  #   2. live load+query in duckdb-wasm (informational / continue-on-error) —
  #      expected-red until an official duckdb-wasm ships a matching v1.5.4
  #      build (a version/emscripten skew between the engine and the extension
  #      surfaces as an ABI mismatch on LOAD).
  wasm-load-test:
    name: WASM load test
    needs: [duckdb-stable-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download WASM artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: yaml-v1.5.5-extension-wasm_*
          path: wasm-artifacts
      - name: Static symbol check (yaml-cpp must be linked, not unresolved)
        run: bash test/wasm/run_wasm_checks.sh wasm-artifacts
      - name: Live load test in duckdb-wasm (informational until engine matches)
        continue-on-error: true
        timeout-minutes: 10
        working-directory: test/wasm
        run: |
          set -uo pipefail
          timeout 300 npm install --no-save
          mkdir -p repo/v1.5.5/wasm_eh
          cp "$GITHUB_WORKSPACE/wasm-artifacts/yaml-v1.5.5-extension-wasm_eh/yaml.duckdb_extension.wasm" \
             repo/v1.5.5/wasm_eh/
          timeout 240 node load_test.cjs --repo repo --name yaml --platform eh \
            --query "SELECT yaml_valid('a: 1') AS ok" --expect '"ok":true'
